<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Nura — favicon</title>
  <desc>Mark-only favicon. The diamond + N monogram, tight crop, single color.</desc>

  <!-- diamond frame, tight crop -->
  <polygon points="16,1 31,16 16,31 1,16"
           fill="none" stroke="#B05A3A" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- N monogram -->
  <rect x="7" y="4" width="3" height="24" rx="1" fill="#B05A3A"/>
  <rect x="22" y="4" width="3" height="24" rx="1" fill="#B05A3A"/>
  <polygon points="10,4 13,4 22,28 19,28" fill="#B05A3A"/>
  <polygon fill="#F5F1E8" points="14,11 17,11 17,14 14,14"/>
  <polygon fill="#F5F1E8" points="17,17 19,17 18,19"/>

  <!-- radiating light rays -->
  <g stroke="#B05A3A" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5">
    <line x1="16" y1="6" x2="16" y2="2"/>
    <line x1="16" y1="26" x2="16" y2="30"/>
    <line x1="6" y1="16" x2="2" y2="16"/>
    <line x1="26" y1="16" x2="30" y2="16"/>
  </g>
</svg>