<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Noor Ultra-Clean High-Density App Icon / Favicon -->
  <defs>
    <linearGradient id="fav-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E05D34" />
      <stop offset="100%" stop-color="#A53E1B" />
    </linearGradient>
  </defs>

  <!-- Premium Deep Charcoal Rounded Tile -->
  <rect width="64" height="64" rx="16" fill="#1A1A1A" />
  
  <!-- Subtle Internal Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#332E29" stroke-width="1" />

  <!-- N Monogram Ribbons -->
  <!-- Left Column -->
  <rect x="15" y="15" width="7" height="34" rx="3.5" fill="url(#fav-grad)" />

  <!-- Right Column -->
  <rect x="42" y="15" width="7" height="34" rx="3.5" fill="url(#fav-grad)" />

  <!-- Diagonal Light Bridge -->
  <path d="M19 16 C22 16 24 17 26 20 L44 47 C45 49 43 51 40 50 C37 49 35 47 34 45 L17 19 C16 17 17 16 19 16 Z"
