<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130" fill="none">
  <!-- Noor Dark / Inverted Mode Brand Lockup -->
  <defs>
    <!-- Luminous Terracotta Gradient for Dark Surfaces -->
    <linearGradient id="dark-terracotta" x1="15" y1="15" x2="95" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A45" />
      <stop offset="100%" stop-color="#E05D34" />
    </linearGradient>

    <!-- Star Glow -->
    <linearGradient id="dark-star" x1="55" y1="35" x2="55" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD8A8" />
      <stop offset="100%" stop-color="#FFA94D" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (90x90) -->
  <g transform="translate(15, 15)">
    <!-- Deep Charcoal Base with Warm Glow Border -->
    <rect width="100" height="100" rx="24" fill="#24211E" stroke="#38332E" stroke-width="1.2" />
    
    <!-- Outer Orbit Ring -->
    <circle cx="50" cy="50" r="38" stroke="#4A4540" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.6" />

    <!-- Left Pillar Ribbon -->
    <path d="M25 74 V30 C25 26.5 28 24 31.5 24 C35 24 38 26.5 38 30 V70 C38 73.5 35 76 31.5 76 C28 76 25 73.5 25 70 Z"
          fill="url(#dark-terracotta)" />

    <!-- Right Pillar Ribbon -->
    <path d="M62 30 C62 26.5 65 24 68.5 24 C72 24 75 26.5 75 30 V70 C75 73.5 72 76 68.5 76 C65 76 62 73.5 62 70 Z"
          fill="url(#dark-terracotta)" />

    <!-- Diagonal Fluid Bridge -->
    <path d="M31.5 25 C34.5 25 37 26.5 39 30 L67 71 C68.5 73 71 74 73 73 C75 71.5 75 69 73 66 L45 25 C43 22 39 20 35 21 C31 22 30 24 31.5 25 Z"
          fill="url(#dark-terracotta)" />

    <!-- Central Noor Radiance Star -->
    <g transform="translate(50, 49)">
      <path d="M0 -9 C0.8 -3.5 3.5 -0.8 9 0 C3.5 0.8 0.8 3.5 0 9 C-0.8 3.5 -3.5 0.8 -9 0 C-3.5 -0.8 -0.8 -3.5 0 -9 Z"
            fill="url(#dark-star)" />
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Elegant Vertical Separator Line -->
  <line x1="140" y1="30" x2="140" y2="100" stroke="#4A4540" stroke-width="1.5" stroke-linecap="round" />

  <!-- Right Typographic Group -->
  <g transform="translate(162, 0)">
    <!-- Wordmark "Noor" in Warm Sand White -->
    <text x="0" y="68" font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', Georgia, serif" font-size="52" font-weight="600" fill="#F7F4EF" letter-spacing="1.5">Noor</text>
    
    <!-- Arabic Calligraphy "نُور" in Radiant Terracotta -->
    <text x="142" y="64" font-family="'Amiri', 'Traditional Arabic', 'Noto Naskh Arabic', serif" font-size="34" font-weight="700" fill="#FF7A45">نُور</text>

    <!-- Subtitle / Positioning Tagline -->
    <text x="2" y="96" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#A89B88" letter-spacing="4">SOIN NUMÉRIQUE • MAROC</text>
  </g>
</svg>
