<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- Noor (نور) Iconic Radiance Mark — Modern Chirurgical Luxury -->
  <defs>
    <!-- Terracotta to Atlas Sunset Gradient -->
    <linearGradient id="noor-grad-primary" x1="30" y1="20" x2="170" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E05D34" />
      <stop offset="45%" stop-color="#C24E28" />
      <stop offset="100%" stop-color="#8E3214" />
    </linearGradient>

    <!-- Luminous Core Gradient (Noor / Light) -->
    <linearGradient id="noor-core-glow" x1="100" y1="65" x2="100" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Subtle Depth Shadow for Ribbon Overlap -->
    <filter id="soft-depth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1A1A1A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Soft Outer Aura (Subtle Moroccan Octagram Geometry) -->
  <rect x="22" y="22" width="156" height="156" rx="36" fill="#FFF3EC" stroke="#F0EBE2" stroke-width="1.5" />

  <!-- Radiance Rays (Subtle minimalist light coordinates) -->
  <circle cx="100" cy="100" r="68" stroke="#E4DDD0" stroke-width="1" stroke-dasharray="2 6" opacity="0.8" />

  <!-- The Architectural N Ribbon of Light -->
  <!-- Left Pillar Ribbon -->
  <path d="M56 142 V62 C56 55.37 61.37 50 68 50 C74.63 50 80 55.37 80 62 V134 C80 140.63 74.63 146 68 146 C61.37 146 56 140.63 56 134 Z"
        fill="url(#noor-grad-primary)" />

  <!-- Right Pillar Ribbon -->
  <path d="M120 66 C120 59.37 125.37 54 132 54 C138.63 54 144 59.37 144 66 V138 C144 144.63 138.63 150 132 150 C125.37 150 120 144.63 120 138 Z"
        fill="url(#noor-grad-primary)" />

  <!-- Dynamic Sweeping Diagonal Ribbon with Optical Depth -->
  <path d="M68 52 C73 52 77 54 81 59 L131 137 C133 140 137 142 141 140 C144 138 144 134 141 129 L91 51 C87 45 80 42 73 44 C67 46 65 50 68 52 Z"
        fill="url(#noor-grad-primary)"
        filter="url(#soft-depth)" />

  <!-- Central Radiance Aperture / Noor Beacon -->
  <!-- The intersecting focal lens: light emerging through the geometry -->
  <g transform="translate(100, 98)">
    <!-- 8-Point Moroccan Radiance Starlet (Minimalist) -->
    <path d="M0 -14 C1 -5 5 -1 14 0 C5 1 1 5 0 14 C-1 5 -5 1 -14 0 C-5 -1 -1 -5 0 -14 Z"
          fill="url(#noor-core-glow)" />
    <!-- Center Core Spark -->
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
