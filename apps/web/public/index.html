<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Noor Médecin | نُور</title>
  <meta name="theme-color" content="#B05A3A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F7F4EF;
      color: #1A1A1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .splash-card {
      background: #FFFFFF;
      border: 1px solid rgba(176, 90, 58, 0.15);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(176, 90, 58, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-out;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .badge-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #B05A3A, #8F3E22);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 24px;
      box-shadow: 0 8px 16px rgba(176, 90, 58, 0.25);
    }
    .brand-title {
      font-size: 26px;
      font-weight: 800;
      color: #1A1A1A;
      letter-spacing: -0.5px;
    }
    .brand-arabic {
      color: #B05A3A;
      font-weight: 700;
      font-size: 24px;
      margin-left: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: #666666;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .spinner-ring {
      display: inline-block;
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(176, 90, 58, 0.2);
      border-radius: 50%;
      border-top-color: #B05A3A;
      animation: spin 0.8s linear infinite;
      margin-bottom: 18px;
    }
    .status-text {
      font-size: 13px;
      font-weight: 600;
      color: #B05A3A;
      letter-spacing: 0.2px;
    }
    .footer-pill {
      margin-top: 32px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(13, 92, 58, 0.08);
      color: #0D5C3A;
      font-size: 11px;
      font-weight: 600;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-container">
      <div class="badge-icon">N</div>
      <div class="brand-title">Noor <span class="brand-arabic">نُور</span></div>
    </div>
    <p class="subtitle">Plateforme Médicale Intégrée pour Médecins & Spécialistes au Maroc</p>
    
    <div class="spinner-ring" id="spinner"></div>
    <div class="status-text" id="statusMsg">Chargement du cabinet médical...</div>

    <div class="footer-pill">
      <span>🇲🇦</span>
      <span>Conforme CNDP & Ordre National des Médecins</span>
    </div>
  </div>

  <script>
    (function() {
      // If we are in Capacitor webview and pointing to live server, redirect if needed
      var statusMsg = document.getElementById('statusMsg');
      
      // Auto-transition to the root Next.js web application if accessed in browser or local server
      if (window.location.pathname.endsWith('index.html') || window.location.pathname === '/') {
        setTimeout(function() {
          if (window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1')) {
            window.location.href = '/';
          }
        }, 300);
      }
    })();
  </script>
</body>
</html>
