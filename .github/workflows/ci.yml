name: CI Quality & Test Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  DATABASE_URL: 'postgresql://saas_owner:owner_secret_dev_pass@localhost:5432/saas_dev?schema=public'
  TEST_DATABASE_URL: 'postgresql://saas_owner:owner_secret_dev_pass@localhost:5432/saas_test?schema=public'
  TEST_APP_DATABASE_URL: 'postgresql://saas_app:app_secret_dev_pass@localhost:5432/saas_test?schema=public'
  ENCRYPTION_MASTER_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
  BLIND_INDEX_SALT: 'fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210'
  JWT_SECRET: 'ci_jwt_test_secret_for_automated_testing_pipeline_32char'

jobs:
  code-quality:
    name: Code Quality (Lint & Typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @doctors-morocco/db prisma generate

      - name: Typecheck monorepo
        run: pnpm run typecheck

      - name: Lint codebase
        run: pnpm run lint

  automated-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [code-quality]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saas_owner
          POSTGRES_PASSWORD: owner_secret_dev_pass
          POSTGRES_DB: saas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize PostgreSQL extensions and test DB
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=owner_secret_dev_pass psql -h localhost -U saas_owner -d saas_dev -f docker/init-db.sql

      - name: Generate Prisma Client
        run: pnpm --filter @doctors-morocco/db prisma generate

      - name: Apply DB Migrations
        run: pnpm --filter @doctors-morocco/db prisma migrate deploy

      - name: Seed Database
        run: pnpm --filter @doctors-morocco/db db:seed

      - name: Run Web Tests (Vitest)
        run: pnpm --filter web test

      - name: Run API Tests (Vitest + RLS)
        run: pnpm --filter api test

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Web Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: doctors-morocco-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: doctors-morocco-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
