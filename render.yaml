services:
  # ====================================================================
  # Noor Medical SaaS - Backend API (NestJS)
  # ====================================================================
  - type: web
    name: noor-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @doctors-morocco/db build && pnpm --filter @doctors-morocco/shared build && pnpm --filter api build
    startCommand: node apps/api/dist/apps/api/main.js
    healthCheckPath: /api/v1/analytics/dashboard
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
      - key: DATABASE_URL
        value: postgresql://postgres.vqdgcidlzxnfjdmpxlsf:Ilovesummer%40007@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: APP_DATABASE_URL
        value: postgresql://saas_app.vqdgcidlzxnfjdmpxlsf:SaasAppSecure2026!@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_TTL
        value: "900s"
      - key: JWT_REFRESH_TOKEN_TTL
        value: "43200"
      - key: PATIENT_ENCRYPTION_KEY
        value: 920bd7f5c0e2dd2302f20e135f0b705977414a603ebe5fbef26071f393ce229f
      - key: BLIND_INDEX_PEPPER
        value: a7b3c4d5e6f7890123456789abcdef0123456789abcdef0123456789abcdef01

  # ====================================================================
  # Noor Medical SaaS - Web Application (Next.js 14)
  # ====================================================================
  - type: web
    name: noor-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @doctors-morocco/shared build && pnpm --filter web build
    startCommand: pnpm --filter web start -- -p 10000
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: fr
      - key: NEXT_PUBLIC_API_URL
        value: https://noor-api.onrender.com
